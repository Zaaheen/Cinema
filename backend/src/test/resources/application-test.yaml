spring:
  datasource:
    url: jdbc:h2:mem:cinema;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-automated-tests-only-0123456789abcdef
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
  cors:
    allowed-origins: http://localhost:5173
